[project]
name = "ecom-rag-kb"
version = "0.1.0"
description = "基于 LangChain 的企业级电商知识库 RAG 问答系统"
requires-python = ">=3.11"

# 版本均为 `pip index versions` 实测可得，非文档推断。
dependencies = [
    # --- LangChain 1.x ---
    # 刻意不含 langchain-community（0.4.2 已冻结，官方 issue #674）
    # 刻意不含 langchain-classic（1.0.8，legacy 过渡包）
    "langchain>=1.4.3",
    "langchain-core>=1.6.7",
    "langchain-openai>=1.6.7",          # chat，指向百炼兼容端点
    "langchain-text-splitters>=1.1.3",  # 结构化分块
    # 刻意不含 langchain-chroma：向量库直接用 chromadb 驱动
    # （理由见 indexing/vectorstore.py 的模块文档）。装一个不 import 的包，
    # 只会让「刻意不引入 X」这句话在这份依赖表里变得不可信。
    # chromadb 必须 >=1.5.4 才支持 Python 3.13
    "chromadb>=1.5.4",

    # --- Web ---
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=3.5.0",
    "python-multipart>=0.0.20",         # 文件上传
    "httpx>=0.28.0",                    # 调 DashScope 原生 rerank 端点

    # --- 检索 ---
    "jieba>=0.42.1",                    # 中文分词，替代 text.split()
    "rank-bm25>=0.2.2",

    # --- 存储 ---
    # [asyncio] 拉入 greenlet,SQLAlchemy 的异步模式依赖它做上下文切换
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # --- 安全 ---
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",

    # --- 文档解析 ---
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
]

[project.optional-dependencies]
# 本地 embedding/rerank Provider 专用。默认不装，主路径走云端。
# 装法：pip install -e ".[local]"
local = [
    "sentence-transformers>=6.1.0",
    "torch>=2.6.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# 源码根是 backend/,app 因此成为顶层包，`import app.*` 在安装后与
# 直接跑脚本（sys.path 注入）两种方式下都成立。
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
# 本项目的门禁是 `ruff check`,**不跑 `ruff format`**。
#
# 这不是漏配,是选择:代码是按 100 列手工折行的,有些地方刻意把一行拆开
# 是为了让「调用 + 参数」贴在注释旁边读得顺;`ruff format` 会把它们重新
# 合并成一行。谁想引入 format,得先接受一次覆盖 30+ 个文件的重排 diff,
# 而那会把「这次真正改了什么」淹掉。
#
# 所以看到 `ruff format --check` 报一堆文件,那是预期内的,不要顺手 --fix。

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# B008 会报 `Depends()` 出现在参数默认值里 —— 而那正是 FastAPI 的官方写法。
# 逐处 `# noqa: B008` 只会让真正的 bugbear 警告被淹没，所以按 FastAPI 文档
# 的做法把这些标记为「不可变调用」。
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.File", "fastapi.Form", "fastapi.Header"]
